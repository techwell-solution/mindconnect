{% extends "base.html" %}

{% block title %}Create New Password | MindConnect{% endblock %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-5">

                        <div class="text-center mb-4">
                            <h2 class="fw-bold">
                                Create New Password
                            </h2>

                            <p class="text-muted">
                                Please enter your new password below.
                            </p>
                        </div>

                        <form method="post">

                            {% csrf_token %}

                            {{ form.as_p }}

                            <button class="btn btn-success w-100">
                                Reset Password
                            </button>

                        </form>

                    </div>
                </div>

            </div>

        </div>
    </div>
</section>
{% endblock %}
